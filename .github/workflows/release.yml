name: Release
run-name: ${{ inputs.channel || 'nightly' }} release by @${{ github.actor }}

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [nightly, production]
        default: nightly
        required: true

permissions:
  contents: read

env:
  RELEASE_CHANNEL: ${{ inputs.channel || 'nightly' }}

concurrency:
  group: serein-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --cwd .github/release --frozen-lockfile --ignore-scripts
      - run: bun .github/release/check.mjs
      - name: Calculate semantic version and notes
        id: version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun .github/release/release.mjs plan
      - name: Apply planned version to manifests
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 .github/release/version.py "$VERSION"
      - uses: actions/upload-artifact@v7.0.1
        if: steps.version.outputs.release == 'true'
        with:
          name: release-manifests
          path: |
            Cargo.toml
            Cargo.lock
            fuzz/Cargo.lock
            target/release-plan.json
          if-no-files-found: error
          retention-days: 14

  linux:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    uses: ./.github/workflows/linux-packages.yml
    with:
      release: true
      tag: ${{ needs.prepare.outputs.tag }}

  publish:
    needs: [prepare, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --cwd .github/release --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-manifests
          path: .
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: serein-*
          path: release-assets
          merge-multiple: true
      - name: Checksums
        working-directory: release-assets
        run: sha256sum ./* > SHA256SUMS.txt
      - name: Commit versions and publish semantic release with notes and assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun .github/release/release.mjs publish
